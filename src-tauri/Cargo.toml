[package]
name = "jotter"
version = "0.1.0"
description = "A local rich-text notepad replacement with an actions page"
authors = ["Fortuvia LLC"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "jotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
chrono = "0.4"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4"
# Reads CF_HDROP: the paths Explorer puts on the clipboard when a file is
# copied. That is what lets a paste attach a link instead of a copy.
clipboard-win = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
